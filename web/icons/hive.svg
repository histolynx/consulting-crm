<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a1f0c"/>
      <stop offset=".55" stop-color="#13100b"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>
    <radialGradient id="node" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3d1"/>
      <stop offset=".45" stop-color="#ffc85c"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- full-bleed background so the icon is also a valid maskable icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- hive: pointy-top hexagon -->
  <polygon points="256,66 420.5,161 420.5,351 256,446 91.5,351 91.5,161"
           fill="rgba(245,165,36,.07)" stroke="url(#rim)" stroke-width="30" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- knowledge graph constellation -->
  <g stroke="#f5a524" stroke-width="13" stroke-linecap="round" opacity=".9">
    <line x1="190" y1="206" x2="316" y2="186"/>
    <line x1="190" y1="206" x2="232" y2="326"/>
    <line x1="316" y1="186" x2="232" y2="326"/>
    <line x1="316" y1="186" x2="338" y2="306"/>
    <line x1="232" y1="326" x2="338" y2="306"/>
  </g>
  <g filter="url(#glow)" fill="url(#node)">
    <circle cx="190" cy="206" r="27"/>
    <circle cx="316" cy="186" r="33"/>
    <circle cx="232" cy="326" r="30"/>
    <circle cx="338" cy="306" r="23"/>
  </g>
</svg>
